<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор Персонажа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #001f3f;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        a {
            display: block;
            font-family: Arial, sans-serif;
            color: #00aa00;
            text-align: center;
            margin: 40px;
            font-size: 25px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #003366;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .option, .document {
            display: block;
            padding: 10px;
            margin: 10px;
            background: #005599;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .option:hover, .document:hover {
            background: #0077cc;
        }
        button {
            background: #ffcc00;
            color: #000;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #ffdd44;
        }
    </style>
</head>
<body>
<div class="container">
    <h3>Поздравляем! Вы угадали убийцу! Теперь вы можете прочесть финальный допрос</h3>
    <a href="https://cloud.mail.ru/public/fsbV/q5XqsXrjY" target="_blank">Допрос</a>
</div>

<script>
    let selectedCharacter = null;
    let selectedDocuments = [];

    document.querySelectorAll('.option').forEach(option => {
        option.addEventListener('click', function() {
            document.querySelectorAll('.option').forEach(opt => opt.style.background = '#005599');
            this.style.background = '#00aa00';
            selectedCharacter = this;
        });
    });

    document.querySelectorAll('.document').forEach(doc => {
        doc.addEventListener('click', function() {
            if (selectedDocuments.includes(this)) {
                this.style.background = '#005599';
                selectedDocuments = selectedDocuments.filter(d => d !== this);
            } else if (selectedDocuments.length < 3) {
                this.style.background = '#00aa00';
                selectedDocuments.push(this);
            }
        });
    });

    function checkSelection() {
        if (!selectedCharacter || selectedDocuments.length !== 4) {
            alert('Выберите одного персонажа и четыре документа!');
            return;
        }

        let characterCorrect = selectedCharacter.getAttribute('data-correct') === 'true';
        let correctDocumentsCount = selectedDocuments.filter(doc => doc.getAttribute('data-correct') === 'true').length;

        if (characterCorrect && correctDocumentsCount === 3) {
            window.location.href = 'answer1.html';
        } else {
            alert(`Правильных ответов: ${characterCorrect ? 1 : 0} персонаж, ${correctDocumentsCount} документа(ов). Подумайте ещё!`);
        }
    }
</script>
</body>
</html>
